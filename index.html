<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>Number Runner Plus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      direction: rtl;
    }

    #game-container {
      position: relative;
      width: 400px; height: 650px;
      max-width: 100vw; max-height: 100vh;
      background: linear-gradient(#111, #222);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
    }

    canvas { width: 100%; height: 100%; background: #222; display: block; }

    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      background: radial-gradient(circle at top, rgba(0,200,100,0.2), #000);
      color: #fff; z-index: 10;
      text-align: center; padding: 20px;
    }

    .btn {
      padding: 10px 25px; margin: 6px;
      border-radius: 999px; border: none;
      background: #00c853; color: #fff;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
    }

    .btn.secondary { background: #424242; }

    #hud {
      position: absolute; top: 8px; left: 8px; right: 8px;
      display: flex; justify-content: space-between;
      color: #fff; font-size: 13px; z-index: 5;
    }

    #mobile-controls {
      position: absolute; bottom: 10px; left: 0; right: 0;
      display: flex; justify-content: space-around;
      padding: 0 10px; gap: 10px; z-index: 6;
    }

    .control-btn {
      flex: 1; padding: 12px 0;
      border-radius: 999px; border: none;
      background: rgba(0,0,0,0.6);
      color: white; font-size: 16px; font-weight: 600;
    }

  </style>
</head>

<body>
<div id="game-container">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="score">النقاط: 0</div>
    <div id="level">المستوى: 1</div>
    <div id="lives">❤️❤️❤️</div>
    <div id="best">أفضل: 0</div>
  </div>

  <div id="start-screen" class="overlay">
    <h1>Number Runner 🏃‍♂️</h1>
    <p>تحرّك بين المسارات — التقط الأزرق وتجنب الأحمر — اقفز فوق العقبات!</p>
    <button class="btn" id="start-btn">ابدأ اللعبة</button>
  </div>

  <div id="gameover-screen" class="overlay" style="display:none;">
    <h1>انتهت اللعبة 💥</h1>
    <p id="final-score">نقاطك: 0</p>
    <p id="final-best">أفضل نتيجة: 0</p>
    <button class="btn" id="retry-btn">إعادة اللعب</button>
    <button class="btn secondary" id="back-btn">رجوع</button>
  </div>

  <div id="mobile-controls">
    <button class="control-btn" id="left-btn">◀</button>
    <button class="control-btn" id="jump-btn">⬆</button>
    <button class="control-btn" id="right-btn">▶</button>
  </div>
</div>

<script>
/* ------------------- إعدادات اللعبة ------------------- */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = 400; canvas.height = 650;

const GAME_WIDTH = 400;
const GAME_HEIGHT = 650;
const GROUND_Y = GAME_HEIGHT - 100;

/* ------------------- المسارات ------------------- */
let lanes = [
  GAME_WIDTH * 0.2,
  GAME_WIDTH * 0.5,
  GAME_WIDTH * 0.8
];

/* ------------------- اللاعب ------------------- */
let player = {
  laneIndex: 1,
  width: 40,
  height: 60,
  x: lanes[1] - 40/2,
  targetX: lanes[1] - 40/2,
  y: GROUND_Y,
  baseY: GROUND_Y,
  vy: 0,
  isJumping: false
};

/* ------------------- متغيرات اللعبة ------------------- */
let obstacles = [];
let score = 0;
let level = 1;
let lives = 3;

let bestScore = parseInt(localStorage.getItem("bestScore") || "0", 10);

/* ------------------- الأصوات ------------------- */
let audioCtx=null;
function play(freq, duration=150) {
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime+duration/1000);
}

/* ------------------- تحديث الواجهة ------------------- */
function updateHUD(){
  document.getElementById("score").textContent="النقاط: "+score;
  document.getElementById("level").textContent="المستوى: "+level;
  document.getElementById("lives").textContent="❤️".repeat(lives);
  document.getElementById("best").textContent="أفضل: "+bestScore;
}

/* ------------------- إعادة اللعبة ------------------- */
function resetGame(){
  score=0; level=1; lives=3;
  obstacles=[];
  player.laneIndex=1;
  player.x = lanes[1] - player.width/2;
  player.targetX = player.x;
  player.y = GROUND_Y;
  player.baseY = GROUND_Y;
  player.vy = 0;
  player.isJumping = false;
  updateHUD();
}

/* ------------------- توليد العقبات ------------------- */
let spawnInterval = 1000, lastSpawn = 0;

function spawnObstacle(time){
  if(time-lastSpawn < spawnInterval) return;
  lastSpawn = time;

  let laneIndex = Math.floor(Math.random()*3);
  let isEven = Math.random() < 0.5;
  let value = isEven ? (2 * (1+Math.floor(Math.random()*9)))
                     : (1 + 2*Math.floor(Math.random()*9));

  obstacles.push({
    laneIndex,
    y: -40,
    width: 40,
    height: 40,
    value,
    isEven,
    speed: 2.5 + Math.random()*1.5
  });
}

/* ------------------- حركة اللاعب يمين/يسار ------------------- */
function movePlayer(dir){
  if(dir==="left" && player.laneIndex>0) player.laneIndex--;
  if(dir==="right" && player.laneIndex<2) player.laneIndex++;

  player.targetX = lanes[player.laneIndex] - player.width/2;
}

/* ------------------- القفز ------------------- */
function jump(){
  if(player.isJumping) return;
  player.isJumping = true;
  player.vy = -10;
  play(600);
}

/* ------------------- رسم اللاعب ------------------- */
function drawPlayer(){
  const {x,y,width,height} = player;

  // رأس
  ctx.beginPath();
  ctx.fillStyle="#ffcc80";
  ctx.arc(x+width/2, y+20, 18, 0, Math.PI*2);
  ctx.fill();

  // شعر
  ctx.fillStyle="#5d4037";
  ctx.beginPath();
  ctx.arc(x+width/2, y+16, 18, Math.PI, 0);
  ctx.fill();

  // جسم
  ctx.fillStyle="#1e88e5";
  ctx.fillRect(x+8, y+35, width-16, height-40);

  // أرجل
  ctx.fillStyle="#212121";
  ctx.fillRect(x+8, y+height-20, 10, 20);
  ctx.fillRect(x+width-18, y+height-20, 10, 20);
}

/* ------------------- رسم العقبات ------------------- */
function drawObstacles(){
  obstacles.forEach(o=>{
    const x = lanes[o.laneIndex] - o.width/2;
    ctx.fillStyle = o.isEven ? "#2962ff" : "#d50000";
    ctx.fillRect(x, o.y, o.width, o.height);
    ctx.fillStyle="#fff";
    ctx.font="bold 16px sans-serif";
    ctx.fillText(o.value, x+20, o.y+22);
  });
}

/* ------------------- التصادم ------------------- */
function collide(a,b){
  return !(a.x+a.width<b.x || a.x>b.x+b.width ||
           a.y+a.height<b.y || a.y>b.y+b.height);
}

/* ------------------- حلقة اللعبة ------------------- */
let gameRunning=false;
let lastTime=0;

function gameLoop(time){
  if(!gameRunning) return;

  const delta = time-lastTime; lastTime=time;

  ctx.clearRect(0,0,GAME_WIDTH,GAME_HEIGHT);

  // حركة اللاعب يمين/يسار
  player.x += (player.targetX - player.x) * 0.25;

  // فيزياء القفز
  if(player.isJumping){
    player.vy += 0.5;
    player.y += player.vy;
    if(player.y >= player.baseY){
      player.y = player.baseY;
      player.vy = 0;
      player.isJumping = false;
    }
  }

  // توليد العقبات
  spawnObstacle(time);

  // تحريك العقبات ومعالجة التصادم
  for(let i=obstacles.length-1; i>=0; i--){
    let o = obstacles[i];
    o.y += o.speed;

    let pr = {x:player.x, y:player.y, width:player.width, height:player.height};
    let or = {x:lanes[o.laneIndex]-20, y:o.y, width:o.width, height:o.height};

    const jumping = player.isJumping && player.y < player.baseY - 20;

    if(collide(pr,or)){
      if(jumping){
        obstacles.splice(i,1);
        continue;
      }
      if(o.isEven){
        score+=10; play(800);
      } else {
        lives--; play(200);
        if(lives<=0){ endGame(); return; }
      }
      updateHUD();
      obstacles.splice(i,1);
    }

    if(o.y > GAME_HEIGHT+40){
      if(o.isEven){ lives--; play(200); updateHUD(); }
      obstacles.splice(i,1);
    }
  }

  // رسم
  drawPlayer();
  drawObstacles();

  requestAnimationFrame(gameLoop);
}

/* ------------------- نهاية اللعبة ------------------- */
function endGame(){
  gameRunning=false;
  document.getElementById("gameover-screen").style.display="flex";
  document.getElementById("final-score").textContent="نقاطك: "+score;
  if(score>bestScore){
    bestScore=score;
    localStorage.setItem("bestScore", bestScore);
  }
  document.getElementById("final-best").textContent="أفضل نتيجة: "+bestScore;
  play(140);
}

/* ------------------- بدء اللعبة ------------------- */
function startGame(){
  resetGame();
  document.getElementById("start-screen").style.display="none";
  document.getElementById("gameover-screen").style.display="none";
  gameRunning=true;
  requestAnimationFrame(gameLoop);
}

/* ------------------- التحكم ------------------- */
window.addEventListener("keydown",(e)=>{
  if(!gameRunning){
    if(e.key===" "||e.key==="Enter"){ startGame(); }
    return;
  }
  if(e.key==="ArrowLeft") movePlayer("left");
  if(e.key==="ArrowRight") movePlayer("right");
  if(e.key==="ArrowUp"||e.key===" ") jump();
});

document.getElementById("left-btn").onclick=()=>movePlayer("left");
document.getElementById("right-btn").onclick=()=>movePlayer("right");
document.getElementById("jump-btn").onclick=()=>jump();

/* ------------------- زر البداية ------------------- */
document.getElementById("start-btn").onclick=startGame;
document.getElementById("retry-btn").onclick=startGame;
document.getElementById("back-btn").onclick=()=>{
  document.getElementById("gameover-screen").style.display="none";
  document.getElementById("start-screen").style.display="flex";
};

</script>
</body>
</html>

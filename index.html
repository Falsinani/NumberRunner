<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>Number Runner Plus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      direction: rtl;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: contain;
    }

    #game-container {
      position: relative;
      width: 400px;
      max-width: 100vw;
      height: 650px;
      max-height: 100vh;
      background: linear-gradient(#111, #222);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #222;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, rgba(0, 200, 100, 0.2), #000);
      color: #fff;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }

    .overlay h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .overlay p {
      font-size: 14px;
      margin-bottom: 15px;
      opacity: 0.8;
    }

    .btn {
      padding: 10px 20px;
      margin: 5px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      background: #00c853;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0, 200, 83, 0.5);
      transition: transform 0.1s, box-shadow 0.1s, background 0.1s;
      min-width: 120px;
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 2px 6px rgba(0, 200, 83, 0.3);
    }

    .btn.secondary {
      background: #424242;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 13px;
      z-index: 5;
      pointer-events: none;
    }

    #hud div {
      pointer-events: none;
    }

    #mobile-controls {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      z-index: 6;
      padding: 0 10px;
      gap: 10px;
    }

    .control-btn {
      flex: 1;
      padding: 12px 0;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .control-btn:active {
      background: rgba(0, 200, 83, 0.7);
    }

    @media (max-width: 480px) {
      #game-container {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div id="score">النقاط: 0</div>
      <div id="level">المستوى: 1</div>
      <div id="lives">❤️❤️❤️</div>
      <div id="best">أفضل: 0</div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
      <h1>Number Runner 🏃‍♂️</h1>
      <p>
        تحرّك بين المسارات الثلاثة<br />
        ✅ التقط الأعداد <b>الزوجية</b><br />
        ❌ وتجنّب الأعداد <b>الفردية</b><br />
        السرعة والأرقام عشوائية في كل مرة!
      </p>
      <button class="btn" id="start-btn">ابدأ اللعبة</button>
      <button class="btn secondary" id="how-btn">طريقة اللعب</button>
      <p style="margin-top:10px;font-size:12px;opacity:0.7;">
        استخدم الأسهم ◀ ▶ أو الأزرار في الأسفل للتحرك.
      </p>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="overlay" style="display:none;">
      <h1>انتهت اللعبة 💥</h1>
      <p id="final-score">نقاطك: 0</p>
      <p id="final-best">أفضل نتيجة: 0</p>
      <button class="btn" id="retry-btn">إعادة اللعب</button>
      <button class="btn secondary" id="back-btn">رجوع للقائمة</button>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
      <button class="control-btn" id="left-btn">◀ يسار</button>
      <button class="control-btn" id="right-btn">يمين ▶</button>
    </div>
  </div>

  <script>
    // ===== Canvas Setup =====
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // ثابت: مقاس منطقي للرسم، ثم نحجّمه مع CSS
    const GAME_WIDTH = 400;
    const GAME_HEIGHT = 650;
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    // ===== Elements =====
    const startScreen = document.getElementById("start-screen");
    const gameoverScreen = document.getElementById("gameover-screen");
    const startBtn = document.getElementById("start-btn");
    const howBtn = document.getElementById("how-btn");
    const retryBtn = document.getElementById("retry-btn");
    const backBtn = document.getElementById("back-btn");

    const scoreEl = document.getElementById("score");
    const levelEl = document.getElementById("level");
    const livesEl = document.getElementById("lives");
    const bestEl = document.getElementById("best");
    const finalScoreEl = document.getElementById("final-score");
    const finalBestEl = document.getElementById("final-best");

    const leftBtn = document.getElementById("left-btn");
    const rightBtn = document.getElementById("right-btn");

    // ===== Game State =====
    let lanes = [GAME_WIDTH * 0.2, GAME_WIDTH * 0.5, GAME_WIDTH * 0.8]; // 3 مسارات
    let player = {
      laneIndex: 1,
      y: GAME_HEIGHT - 80,
      width: 40,
      height: 50,
    };

    let obstacles = [];
    let score = 0;
    let level = 1;
    let lives = 3;
    let bestScore = parseInt(localStorage.getItem("numberRunnerBest") || "0", 10);
    bestEl.textContent = "أفضل: " + bestScore;

    let gameRunning = false;
    let lastSpawnTime = 0;
    let spawnInterval = 1200; // بالمللي ثانية
    let speedBase = 2.3;

    // ===== Helper Functions =====
    function resetGame() {
      score = 0;
      level = 1;
      lives = 3;
      obstacles = [];
      player.laneIndex = 1;
      lastSpawnTime = 0;
      spawnInterval = 1200;
      speedBase = 2.3;
      updateHUD();
    }

    function updateHUD() {
      scoreEl.textContent = "النقاط: " + score;
      levelEl.textContent = "المستوى: " + level;
      livesEl.textContent = "❤️".repeat(lives);
      bestEl.textContent = "أفضل: " + bestScore;
    }

    function levelUpIfNeeded() {
      const newLevel = 1 + Math.floor(score / 100);
      if (newLevel > level) {
        level = newLevel;
        // اجعل اللعبة أصعب
        spawnInterval = Math.max(500, spawnInterval - 80);
        speedBase += 0.3;
      }
    }

    function spawnObstacle(timestamp) {
      if (timestamp - lastSpawnTime < spawnInterval) return;
      lastSpawnTime = timestamp;

      const laneIndex = Math.floor(Math.random() * 3);
      const isEven = Math.random() < 0.5;
      const value = isEven
        ? 2 * (1 + Math.floor(Math.random() * 9)) // زوجي بين 4 و 20
        : 1 + 2 * Math.floor(Math.random() * 9); // فردي بين 1 و 19

      const speed = speedBase + Math.random() * 1.5;

      obstacles.push({
        laneIndex,
        y: -40,
        width: 40,
        height: 40,
        value,
        isEven,
        speed,
      });
    }

    function movePlayer(dir) {
      if (!gameRunning) return;
      if (dir === "left" && player.laneIndex > 0) {
        player.laneIndex--;
      } else if (dir === "right" && player.laneIndex < lanes.length - 1) {
        player.laneIndex++;
      }
    }

    function rectsCollide(a, b) {
      return !(
        a.x + a.width < b.x ||
        a.x > b.x + b.width ||
        a.y + a.height < b.y ||
        a.y > b.y + b.height
      );
    }

    function endGame() {
      gameRunning = false;
      // حدّث أفضل نتيجة
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("numberRunnerBest", bestScore.toString());
      }
      updateHUD();
      finalScoreEl.textContent = "نقاطك: " + score;
      finalBestEl.textContent = "أفضل نتيجة: " + bestScore;
      gameoverScreen.style.display = "flex";
    }

    // ===== Drawing =====
    function drawBackground() {
      // طريق بسيط بخطوط
      ctx.fillStyle = "#151515";
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // المسارات
      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.lineWidth = 2;
      lanes.forEach((laneX) => {
        ctx.beginPath();
        ctx.moveTo(laneX, 0);
        ctx.lineTo(laneX, GAME_HEIGHT);
        ctx.stroke();
      });
    }

    function drawPlayer() {
      const x = lanes[player.laneIndex] - player.width / 2;
      const y = player.y;
      // جسم اللاعب
      const grd = ctx.createLinearGradient(x, y, x, y + player.height);
      grd.addColorStop(0, "#00e676");
      grd.addColorStop(1, "#00b248");
      ctx.fillStyle = grd;
      ctx.fillRect(x, y, player.width, player.height);

      // رأس بسيط
      ctx.fillStyle = "#ffe082";
      ctx.fillRect(x + 10, y - 16, 20, 16);
    }

    function drawObstacles() {
      obstacles.forEach((o) => {
        const x = lanes[o.laneIndex] - o.width / 2;
        const y = o.y;

        ctx.fillStyle = o.isEven ? "#2962ff" : "#d50000";
        ctx.roundRect(x, y, o.width, o.height, 8);
        ctx.fill();

        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(o.value.toString(), x + o.width / 2, y + o.height / 2);
      });
    }

    // Polyfill بسيط لـ roundRect للمتصفحات القديمة
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
      };
    }

    // ===== Game Loop =====
    let lastTime = 0;

    function gameLoop(timestamp) {
      if (!gameRunning) return;

      const delta = timestamp - lastTime;
      lastTime = timestamp;

      drawBackground();
      spawnObstacle(timestamp);

      // تحديث العقبات
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.y += o.speed;

        // التحقق من التصادم مع اللاعب
        const playerRect = {
          x: lanes[player.laneIndex] - player.width / 2,
          y: player.y,
          width: player.width,
          height: player.height,
        };
        const obstRect = {
          x: lanes[o.laneIndex] - o.width / 2,
          y: o.y,
          width: o.width,
          height: o.height,
        };

        if (rectsCollide(playerRect, obstRect)) {
          // إذا التقطنا رقم زوجي → نكسب نقاط
          if (o.isEven) {
            score += 10;
          } else {
            // رقم فردي → نخسر حياة
            lives -= 1;
            if (lives <= 0) {
              updateHUD();
              drawPlayer();
              drawObstacles();
              endGame();
              return;
            }
          }
          obstacles.splice(i, 1);
          levelUpIfNeeded();
          updateHUD();
          continue;
        }

        // إذا خرجت من الشاشة
        if (o.y > GAME_HEIGHT + 50) {
          // لو رقم زوجي وتركناه يفوت → نخسر حياة
          if (o.isEven) {
            lives -= 1;
            if (lives <= 0) {
              updateHUD();
              drawPlayer();
              drawObstacles();
              endGame();
              return;
            }
          }
          obstacles.splice(i, 1);
          updateHUD();
        }
      }

      drawPlayer();
      drawObstacles();

      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      resetGame();
      startScreen.style.display = "none";
      gameoverScreen.style.display = "none";
      gameRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    // ===== Controls =====
    // لوحة المفاتيح
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        movePlayer("left");
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        movePlayer("right");
      } else if ((e.key === " " || e.key === "Enter") && !gameRunning) {
        // مسافة / إنتر لبدء اللعبة من الشاشة الرئيسية أو بعد النهاية
        if (startScreen.style.display !== "none") {
          startGame();
        } else if (gameoverScreen.style.display !== "none") {
          startGame();
        }
      }
    });

    // أزرار الجوال
    function addTapListener(btn, dir) {
      const handler = (e) => {
        e.preventDefault();
        movePlayer(dir);
      };
      btn.addEventListener("touchstart", handler, { passive: false });
      btn.addEventListener("click", handler);
    }

    addTapListener(leftBtn, "left");
    addTapListener(rightBtn, "right");

    // محاولة تقليل الدبل-تاب زوم (بعض الأجهزة)
    let lastTouchEnd = 0;
    document.addEventListener(
      "touchend",
      (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      },
      { passive: false }
    );

    // ===== UI Buttons =====
    startBtn.addEventListener("click", () => {
      startGame();
    });

    howBtn.addEventListener("click", () => {
      alert(
        "طريقة اللعب:\n\n- اللاعب يجري في 3 مسارات.\n- تحرّك يسار ويمين باستخدام الأسهم أو الأزرار.\n- التقط الأعداد الزوجية (صندوق أزرق) لكسب نقاط.\n- تجنّب الأعداد الفردية (صندوق أحمر)، أو ستخسر حياة.\n- إذا تركت عدد زوجي يفوتك بدون أن تلتقطه، تخسر حياة.\n- عند ارتفاع النقاط يرتفع المستوى وتزيد السرعة والتحدي."
      );
    });

    retryBtn.addEventListener("click", () => {
      startGame();
    });

    backBtn.addEventListener("click", () => {
      gameoverScreen.style.display = "none";
      startScreen.style.display = "flex";
    });
  </script>
</body>
</html>
